<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="遺言書は作っていますか？形式や保管場所、判断能力が低下した時のことを５分で書ける無料ツールです。">

<meta property="og:type" content="website">
<meta property="og:title" content="もしもの時ノート 遺言書のこと">
<meta property="og:description" content="遺言書は作っていますか？形式や保管場所、判断能力が低下した時のことを５分で書ける無料ツールです。">
<meta property="og:url" content="https://will-note.vercel.app/">
<meta property="og:image" content="https://will-note.vercel.app/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="もしもの時ノート 遺言書のこと">
<meta property="og:locale" content="ja_JP">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="もしもの時ノート 遺言書のこと">
<meta name="twitter:description" content="遺言書は作っていますか？形式や保管場所を書いておきましょう。">
<meta name="twitter:image" content="https://will-note.vercel.app/og-image.png">
<meta name="twitter:image:alt" content="もしもの時ノート 遺言書のこと">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6EF; --surface:#FFFFFF; --ink:#33362E; --muted:#7C7A68;
    --accent:#56705A; --accent-dark:#3F5443; --warm:#D98B4E; --warm-soft:#F5E3D0;
    --line:#DEDACB; --danger:#B15A45;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Noto Sans JP', sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:640px; margin:0 auto; padding:40px 20px 80px; }
  .hero{ text-align:center; padding:8px 0 28px; }
  .doc-icon{ width:38px; height:38px; margin:0 auto 10px; color:var(--warm); }
  h1{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:28px;
    margin:0 0 8px; color:var(--accent-dark); letter-spacing:.02em;
  }
  .lead{ color:var(--muted); font-size:14.5px; max-width:38ch; margin:0 auto; }
  .hero-privacy-note{ color:var(--muted); font-size:11.5px; max-width:38ch; margin:10px auto 0; }

  .pet-tabs{
    display:flex; gap:6px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); margin-bottom:22px; padding-bottom:0;
  }
  .pet-tab{
    font-family:'Zen Maru Gothic', sans-serif; background:none; border:none;
    padding:10px 16px; font-size:15px; color:var(--muted); cursor:pointer;
    border-bottom:3px solid transparent; transition:color .15s ease; white-space:nowrap;
  }
  .pet-tab:hover{ color:var(--accent-dark); }
  .pet-tab.active{ color:var(--accent-dark); font-weight:700; border-bottom-color:var(--warm); }
  .pet-tab-add{
    font-family:'Noto Sans JP', sans-serif; background:none; border:none;
    padding:10px 14px; font-size:14px; color:var(--accent); cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .pet-tab-add:hover{ color:var(--accent-dark); }

  .sheet{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px 26px 8px; }
  .empty{ text-align:center; padding:50px 20px 60px; color:var(--muted); }
  .empty button{ margin-top:14px; }

  .field-row{
    display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:start;
    padding:14px 0; border-bottom:1px dashed var(--line);
  }
  .field-row:last-of-type{ border-bottom:none; }
  .field-label{ font-size:13.5px; color:var(--muted); padding-top:10px; }
  input[type="text"], textarea{
    width:100%; font-family:'Noto Sans JP', sans-serif; font-size:15px; color:var(--ink);
    padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#FCFBF7;
    transition:border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus, textarea:focus{ outline:none; border-color:var(--accent); background:#fff; }
  textarea{ min-height:80px; resize:vertical; }

  .section-title{
    font-family:'Zen Maru Gothic', sans-serif; font-size:15px; font-weight:700;
    color:var(--accent-dark); margin:26px 0 4px; display:flex; align-items:center; gap:8px;
  }
  .section-title:first-of-type{ margin-top:4px; }
  .section-title::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--warm); display:inline-block; }
  .section-help{ font-size:12.5px; color:var(--muted); margin:-2px 0 12px 14px; }

  .toggle-group{ display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 22px; }
  .toggle-btn{
    font-family:'Noto Sans JP', sans-serif; padding:8px 14px; border-radius:8px;
    border:1px solid var(--line); background:#FCFBF7; color:var(--muted);
    font-size:13.5px; cursor:pointer;
  }
  .toggle-btn.selected{
    background:var(--warm-soft); border-color:var(--warm); color:var(--accent-dark); font-weight:600;
  }

  .detail-block{
    background:#FCFBF7; border:1px solid var(--line); border-radius:10px;
    padding:4px 14px; margin:-14px 0 22px;
  }
  .detail-block .field-row{ padding:11px 0; }

  .row-actions{ display:flex; justify-content:flex-end; padding:16px 0 20px; }
  .delete-link{
    background:none; border:none; color:var(--danger); font-size:13px; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px; opacity:.75;
  }
  .delete-link:hover{ opacity:1; }

  .autosave-note{ text-align:center; color:var(--accent-dark); font-size:12.5px; margin:0 0 16px; }
  .share-block{
    margin-top:20px; background:var(--warm-soft); border:1px solid #EAD2AE;
    border-radius:12px; padding:18px 18px 16px;
  }
  .share-buttons{ display:flex; gap:10px; flex-wrap:wrap; }
  .share-btn{
    font-family:'Noto Sans JP', sans-serif; font-size:14px; font-weight:600;
    padding:11px 14px; border-radius:9px; border:none; cursor:pointer; flex:1;
    min-width:120px; display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .1s ease, opacity .15s ease;
  }
  .share-btn:active{ transform:scale(0.98); }
  .share-btn.image{ background:var(--warm-soft); color:var(--accent-dark); border:1px solid var(--warm); }
  .share-btn.image:hover{ background:#f0dcb8; }
  .share-btn.print{ background:#fff; color:var(--accent-dark); border:1px solid var(--accent); }
  .share-btn.print:hover{ background:#fff8ee; }

  .foot-note{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:26px; }

  .preview-overlay{
    position:fixed; inset:0; background:var(--bg); display:none;
    justify-content:center; overflow-y:auto; z-index:100;
  }
  .preview-overlay.show{ display:flex; }
  .preview-wrap{ max-width:480px; width:100%; min-height:100%; display:flex; flex-direction:column; }
  .preview-close-row{ display:flex; justify-content:flex-end; padding:14px 16px 0; }
  .preview-close{
    background:none; border:none; color:var(--muted); font-size:14px; padding:8px 6px; cursor:pointer;
  }
  .preview-close:hover{ color:var(--accent-dark); }
  .preview-cards{ padding:6px 16px 4px; flex:1; }
  .preview-card{
    background:#fff; border-radius:18px; overflow:hidden;
    box-shadow:0 8px 24px rgba(51,54,46,0.12); margin-bottom:16px;
  }
  .preview-card:last-child{ margin-bottom:0; }
  .preview-card-top{ background:var(--accent); padding:26px 22px 20px; color:#fff; text-align:center; }
  .preview-card-top .doc-mini{ width:26px; height:26px; margin:0 auto 8px; opacity:0.9; }
  .preview-card-top h2{ font-family:'Zen Maru Gothic', sans-serif; font-size:24px; margin:0 0 2px; }
  .preview-card-top .sub{ font-size:13.5px; opacity:0.9; }
  .preview-card-body{ padding:20px 22px 24px; }
  .preview-row{ padding:10px 0; border-bottom:1px dashed var(--line); }
  .preview-row:last-child{ border-bottom:none; }
  .preview-row .k{ font-size:12px; color:var(--muted); margin-bottom:3px; }
  .preview-row .v{ font-size:14.5px; color:var(--ink); white-space:pre-wrap; }
  .preview-instruction{ text-align:center; color:var(--muted); font-size:12.5px; padding:4px 16px 20px; }

  #printSheet{ display:none; }

  @media (max-width:480px){
    .field-row{ grid-template-columns:1fr; gap:6px; }
    .field-label{ padding-top:0; }
  }

  @media print{
    body{ background:#fff; }
    .page > *:not(#printSheet){ display:none !important; }
    #printSheet{ display:block; max-width:680px; margin:0 auto; padding:0; }
    #printSheet h1{ font-family:'Zen Maru Gothic', sans-serif; font-size:22px; color:#33362E; margin-bottom:2px; }
    #printSheet .print-date{ color:#7C7A68; font-size:12px; margin-bottom:24px; }
    .print-pet{
      border:1px solid #DEDACB; border-radius:10px; padding:18px 20px;
      margin-bottom:18px; break-inside:avoid;
    }
    .print-pet h2{ font-family:'Zen Maru Gothic', sans-serif; font-size:17px; color:#3F5443; margin:0 0 10px; }
    .print-sub{ font-size:12.5px; font-weight:700; color:#7C7A68; margin:12px 0 4px; }
    .print-row{
      display:grid; grid-template-columns:110px 1fr; font-size:13.5px;
      padding:5px 0; border-bottom:1px dashed #EEEAD9;
    }
    .print-row .k{ color:#7C7A68; }
    .print-row .v{ white-space:pre-wrap; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <svg class="doc-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M14,2H6C4.9,2,4,2.9,4,4v16c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2V8L14,2z M13,9V3.5L18.5,9H13z"/>
    </svg>
    <h1>遺言書のこと</h1>
    <p class="lead">遺言書は作っていますか？形式や保管場所、判断能力が低下した時のことを書いておきましょう。</p>
    <p class="hero-privacy-note">※入力した内容が外部へ送信・保存されることはありません。すべてお使いの端末内にのみ保存されます。</p>
  </div>

  <nav class="pet-tabs" id="petTabs"></nav>

  <div class="sheet" id="sheetWrap"></div>

  <div class="share-block" id="shareWrap" style="display:none;">
    <p class="autosave-note">✓ 入力するたびに、自動でこの端末に保存されます</p>
    <div class="share-buttons">
      <button class="share-btn image" id="imagePreviewBtn">📷 画像で保存</button>
      <button class="share-btn print" id="printBtn">🖨️ 印刷して保管する（通帳や重要書類と一緒に）</button>
    </div>
  </div>

  <p class="foot-note">※入力した内容が外部へ送信・保存されることはありません。すべてお使いの端末内にのみ保存されます。</p>

</div>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-wrap">
    <div class="preview-close-row">
      <button class="preview-close" id="previewCloseBtn">閉じる ×</button>
    </div>
    <div class="preview-cards" id="previewCard"></div>
    <div class="preview-instruction">この画面をスクリーンショットして、LINEやメールで送りましょう</div>
  </div>
</div>

<div id="printSheet">
  <h1>もしもの時ノート 遺言書のこと</h1>
  <div class="print-date" id="printDate"></div>
  <div id="printPets"></div>
</div>

<script>
const STORAGE_KEY = 'moshimo_will_note_v1';

function genId(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

const HAS_WILL_OPTIONS = ['作成している', '作成していない', '未定'];
const WILL_TYPE_OPTIONS = ['自筆証書遺言', '公正証書遺言', '秘密証書遺言', 'その他'];
const GUARDIAN_OPTIONS = ['家族に任せる', '頼みたい人がいる', '後見制度を利用したい', '未定'];

function migratePerson(p){
  if(p.hasWill === undefined) p.hasWill = '';
  if(p.willType === undefined) p.willType = '';
  if(p.willStorage === undefined) p.willStorage = '';
  if(p.willDate === undefined) p.willDate = '';
  if(p.guardianChoice === undefined) p.guardianChoice = '';
  if(p.guardianFamily === undefined) p.guardianFamily = '';
  if(p.guardianName === undefined) p.guardianName = '';
  if(p.guardianContact === undefined) p.guardianContact = '';
  if(p.notes === undefined) p.notes = '';
  return p;
}

function loadPeople(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return arr.map(migratePerson);
  }catch(e){ return []; }
}
function savePeople(people){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
}
function newPerson(name){
  return {
    id: genId(), name: name || '',
    hasWill:'', willType:'', willStorage:'', willDate:'',
    guardianChoice:'', guardianFamily:'', guardianName:'', guardianContact:'',
    notes: ''
  };
}

let people = loadPeople();
let activeId = people.length ? people[0].id : null;

const petTabs = document.getElementById('petTabs');
const sheetWrap = document.getElementById('sheetWrap');

function getActive(){ return people.find(p => p.id === activeId); }

function esc(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderToggleGroup(name, options, current){
  return `<div class="toggle-group">` + options.map(opt =>
    `<button type="button" class="toggle-btn ${current===opt ? 'selected' : ''}" data-toggle="${name}" data-val="${esc(opt)}">${esc(opt)}</button>`
  ).join('') + `</div>`;
}

function render(){
  petTabs.innerHTML = '';
  people.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'pet-tab' + (p.id === activeId ? ' active' : '');
    btn.textContent = p.name && p.name.trim() ? p.name : '名前未入力';
    btn.addEventListener('click', () => { activeId = p.id; render(); });
    petTabs.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'pet-tab-add';
  addBtn.textContent = '＋ 追加';
  addBtn.addEventListener('click', () => {
    const p = newPerson();
    people.push(p);
    activeId = p.id;
    savePeople(people);
    render();
  });
  petTabs.appendChild(addBtn);

  sheetWrap.innerHTML = '';
  const active = getActive();

  if(!active){
    sheetWrap.innerHTML = `<div class="empty"><div>まだ登録されていません。</div></div>`;
    sheetWrap.querySelector('.empty').insertAdjacentHTML('beforeend',
      '<button id="firstAddBtn" style="max-width:200px;margin:14px auto 0;display:block;background:var(--accent);color:#fff;border:none;padding:12px 16px;border-radius:10px;font-family:\'Zen Maru Gothic\',sans-serif;cursor:pointer;">はじめる</button>');
    document.getElementById('firstAddBtn').addEventListener('click', () => {
      const p = newPerson();
      people.push(p);
      activeId = p.id;
      savePeople(people);
      render();
    });
    document.getElementById('shareWrap').style.display = 'none';
    return;
  }

  document.getElementById('shareWrap').style.display = 'block';

  let html = `
    <div class="section-title">名前</div>
    <div class="field-row" style="grid-template-columns:1fr;">
      <input type="text" id="f_name" value="${esc(active.name)}">
    </div>

    <div class="section-title">遺言書は作っていますか</div>
    ${renderToggleGroup('hasWill', HAS_WILL_OPTIONS, active.hasWill)}
  `;

  if(active.hasWill === '作成している'){
    html += `
    <div class="detail-block">
      <div class="field-row">
        <div class="field-label">形式</div>
        <div style="padding-top:2px;">${renderToggleGroup('willType', WILL_TYPE_OPTIONS, active.willType)}</div>
      </div>
      <div class="field-row">
        <div class="field-label">保管場所</div>
        <input type="text" id="f_willStorage" placeholder="例: 自宅の金庫、公証役場" value="${esc(active.willStorage)}">
      </div>
      <div class="field-row">
        <div class="field-label">作成年月日</div>
        <input type="text" id="f_willDate" placeholder="例: 2024年3月" value="${esc(active.willDate)}">
      </div>
    </div>
    `;
  }

  html += `
    <div class="section-title">判断能力が低下した時の財産管理</div>
    <div class="section-help">認知症などで判断が難しくなった場合、誰に任せたいですか</div>
    ${renderToggleGroup('guardianChoice', GUARDIAN_OPTIONS, active.guardianChoice)}
  `;

  if(active.guardianChoice === '家族に任せる'){
    html += `
    <div class="detail-block">
      <div class="field-row">
        <div class="field-label">誰に</div>
        <input type="text" id="f_guardianFamily" placeholder="例: 配偶者、長男" value="${esc(active.guardianFamily)}">
      </div>
    </div>
    `;
  }

  if(active.guardianChoice === '頼みたい人がいる'){
    html += `
    <div class="detail-block">
      <div class="field-row">
        <div class="field-label">名前</div>
        <input type="text" id="f_guardianName" placeholder="例: 長男、○○さん" value="${esc(active.guardianName)}">
      </div>
      <div class="field-row">
        <div class="field-label">連絡先</div>
        <input type="text" id="f_guardianContact" placeholder="例: 090-0000-0000" value="${esc(active.guardianContact)}">
      </div>
    </div>
    `;
  }

  html += `
    <div class="section-title">伝えておきたいこと</div>
    <div class="field-row" style="grid-template-columns:1fr;">
      <textarea id="f_notes" placeholder="その他、伝えておきたいことがあれば">${esc(active.notes)}</textarea>
    </div>

    <div class="row-actions">
      <button type="button" class="delete-link" id="deleteBtn">この情報を削除する</button>
    </div>
  `;

  sheetWrap.innerHTML = html;

  ['name','willStorage','willDate','guardianFamily','guardianName','guardianContact','notes'].forEach(key => {
    const el = document.getElementById('f_' + key);
    if(!el) return;
    el.addEventListener('input', () => {
      active[key] = el.value;
      if(key === 'name'){ syncTabLabel(); }
      savePeople(people);
    });
  });

  sheetWrap.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const field = btn.dataset.toggle;
      const val = btn.dataset.val;
      active[field] = (active[field] === val) ? '' : val;
      savePeople(people);
      render();
    });
  });

  document.getElementById('deleteBtn').addEventListener('click', () => {
    if(!confirm((active.name || 'この情報') + 'を削除します。よろしいですか？')) return;
    people = people.filter(p => p.id !== active.id);
    activeId = people.length ? people[0].id : null;
    savePeople(people);
    render();
  });
}

function syncTabLabel(){
  const tabs = petTabs.querySelectorAll('.pet-tab');
  const idx = people.findIndex(p => p.id === activeId);
  if(tabs[idx]){
    tabs[idx].textContent = people[idx].name && people[idx].name.trim() ? people[idx].name : '名前未入力';
  }
}

document.getElementById('printBtn').addEventListener('click', () => {
  buildPrintSheet(people);
  window.print();
});

function previewRow(label, value){
  return `<div class="preview-row"><div class="k">${label}</div><div class="v">${esc(value) || '記入なし'}</div></div>`;
}

function willSummary(p){
  if(p.hasWill !== '作成している'){ return p.hasWill || '記入なし'; }
  const parts = [p.willType, p.willStorage, p.willDate].filter(Boolean);
  return '作成している' + (parts.length ? '（' + parts.join(' / ') + '）' : '');
}

function guardianSummary(p){
  if(p.guardianChoice === '家族に任せる'){
    return '家族に任せる' + (p.guardianFamily ? '（' + p.guardianFamily + '）' : '');
  }
  if(p.guardianChoice === '頼みたい人がいる'){
    const parts = [p.guardianName, p.guardianContact].filter(Boolean);
    return '頼みたい人がいる' + (parts.length ? '（' + parts.join(' / ') + '）' : '');
  }
  return p.guardianChoice || '記入なし';
}

function buildCardHTML(p){
  return `
    <div class="preview-card">
      <div class="preview-card-top">
        <svg class="doc-mini" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M14,2H6C4.9,2,4,2.9,4,4v16c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2V8L14,2z M13,9V3.5L18.5,9H13z"/>
        </svg>
        <h2>${esc(p.name) || '名前未入力'}</h2>
        <div class="sub">もしもの時ノート</div>
      </div>
      <div class="preview-card-body">
        ${previewRow('遺言書', willSummary(p))}
        ${previewRow('判断能力が低下した時の財産管理', guardianSummary(p))}
        ${previewRow('伝えておきたいこと', p.notes)}
      </div>
    </div>
  `;
}

function buildPreviewCards(){
  const active = getActive();
  const container = document.getElementById('previewCard');
  container.innerHTML = active
    ? buildCardHTML(active)
    : '<div class="preview-card"><div class="preview-card-body">登録された情報はありません。</div></div>';
}

document.getElementById('imagePreviewBtn').addEventListener('click', () => {
  buildPreviewCards();
  document.getElementById('previewOverlay').classList.add('show');
});
document.getElementById('previewCloseBtn').addEventListener('click', () => {
  document.getElementById('previewOverlay').classList.remove('show');
});
document.getElementById('previewOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'previewOverlay'){ document.getElementById('previewOverlay').classList.remove('show'); }
});

function buildPrintSheet(list){
  document.getElementById('printDate').textContent =
    new Date().toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric'}) + ' 時点';

  const wrap = document.getElementById('printPets');
  wrap.innerHTML = '';

  if(list.length === 0){
    wrap.innerHTML = '<p>登録された情報はありません。</p>';
    return;
  }

  list.forEach(p => {
    const div = document.createElement('div');
    div.className = 'print-pet';
    div.innerHTML = `
      <h2>${esc(p.name) || '（名前未入力）'}</h2>
      <div class="print-row"><div class="k">遺言書</div><div class="v">${esc(willSummary(p))}</div></div>
      <div class="print-row"><div class="k">財産管理</div><div class="v">${esc(guardianSummary(p))}</div></div>
      <div class="print-row"><div class="k">伝えておきたいこと</div><div class="v">${esc(p.notes)}</div></div>
    `;
    wrap.appendChild(div);
  });
}

render();
</script>

</body>
</html>
